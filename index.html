<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <div class="container">
        <div class="top">
            <input type="number" class="inputNumbers">
        </div>

        <div class="bottom">
            <div class="numbers">
                <div class="row">
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                </div> 
                <div class="row">
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                </div>
                <div class="row">
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                 </div>
                  <div class="row">
                    <button id="zero">0</button>
                    <button id="decimal">.</button>
                </div>
            </div>

            <div class="signs">
                <button id="plus">+</button>
                <button id="minus">-</button>
                <button id="multiply">*</button>
                <button id="divide">/</button>
                <button id="equals">=</button>
            </div>
        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
