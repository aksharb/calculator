<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <div class="container">
        <div class="top">
            <input type="text" class="inputNumbers">
        </div>

        <div class="bottom">
            <div class="numbers">
                <div class="row">
                    <button class="digit">7</button>
                    <button class="digit">8</button>
                    <button class="digit">9</button>
                </div> 
                <div class="row">
                    <button class="digit">4</button>
                    <button class="digit">5</button>
                    <button class="digit">6</button>
                </div>
                <div class="row">
                    <button class="digit">1</button>
                    <button class="digit">2</button>
                    <button class="digit">3</button>
                 </div>
                  <div class="row">
                    <button class="digit" id="zero">0</button>
                    <button id="decimal">.</button>
                </div>
            </div>

            <div class="signs">
                <button class="operation" id="plus">+</button>
                <button class="operation" id="minus">-</button>
                <button class="operation" id="multiply">*</button>
                <button class="operation" id="divide">/</button>
                <button class="operation" id="equals">=</button>
            </div>
        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
