<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <div class="container">
        <div class="top">
            <input type="text" class="inputNumbers">
        </div>

        <div class="bottom">
            <div class="numbers">
                <div class="row">
                    <div>7</div>
                    <div>8</div>
                    <div>9</div>
                </div> 
                <div class="row">
                    <div>4</div>
                    <div>5</div>
                    <div>6</div>
                </div>
                <div class="row">
                    <div>1</div>
                    <div>2</div>
                    <div>3</div>
                 </div>
                  <div class="row">
                    <div>0</div>
                    <div id="decimal">.</div>
                </div>
            </div>

            <div class="signs">
                <div id="plus">+</div>
                <div id="minus">-</div>
                <div id="multiply">*</div>
                <div id="divide">/</div>
                <div id="equals">=</div>
            </div>
        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
